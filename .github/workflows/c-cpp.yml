name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pc:
    name: PC build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: make build
      run: make build
    - name: make build TRACE=1
      run: make build TRACE=1
    - name: make build SYMBOLS=1
      run: make build SYMBOLS=1
    - name: Demo for 5 s (informational, no test target yet)
      run: |
        make build
        perl -e 'alarm 5; exec @ARGV' ./bin/demo_atomix.bin > demo.txt 2>&1 || true
        head -20 demo.txt
        lines=$(grep -c 'with counter' demo.txt || true)
        echo "counter lines: $lines"
        if grep -q 'STACK OVERFLOW' demo.txt || [ "$lines" -le 8 ]; then
          echo "::warning title=Demo::$lines counter lines in 5 s (more than 8 expected) or a stack overflow; see spec.md P38"
        fi

  nano:
    name: Arduino Nano build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: arduino/setup-arduino-cli@v2
    - name: Install the AVR core
      run: |
        arduino-cli core update-index
        arduino-cli core install arduino:avr
    - name: Compile arduino/simple for the Nano
      run: arduino-cli compile --fqbn arduino:avr:nano --warnings all arduino/simple
    - name: Compile arduino/simple for the Nano with TRACE_ON
      run: arduino-cli compile --fqbn arduino:avr:nano --warnings all --build-property "compiler.cpp.extra_flags=-DTRACE_ON" arduino/simple
